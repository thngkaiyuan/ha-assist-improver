# The leak guard (tools/leak_guard.py) on each push and pull request: each commit it adds, its message and its whole
# tree, against the household terms, hashed, in the HOUSEHOLD_TERMS secret (made by `tools/leak_guard.py hashes`), and
# each image against the ones someone looked at (tools/looked-at.txt). History already public isn't checked again: the
# maintainer's pre-push hook (tools/git-hooks/leak-guard) and this job stop what's new. A fork's pull request gets no
# secret, so there it skips. In a private repository, where GitHub bills each run, it skips too.
name: Leak guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-guard:
    if: ${{ !github.event.repository.private && !github.event.deleted }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the commits added
        env:
          TERMS: ${{ secrets.HOUSEHOLD_TERMS }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$BASE" ]; then had="origin/$BASE"  # A pull request: less its base branch.
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then had="origin/$DEFAULT"  # A new branch.
          else had="$BEFORE"  # A push: less what the branch had, fetched if a force push left it out of the clone.
            git cat-file -e "$had^{commit}" 2>/dev/null || git fetch -q origin "$had"; fi
          printf '%s\n' "$TERMS" | python3 tools/leak_guard.py --hashed - commits HEAD --not "$had"
