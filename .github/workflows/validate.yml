# The checks HACS's catalog (hacs/default, which the Marketplace in Home Assistant 2026.11 lists) asks to pass.
# In a private repository, where GitHub bills each run, both skip; a scheduled run can't tell, so it runs only once the
# repository's WATCH_HOME_ASSISTANT variable is "on" (home-assistant.yml).
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    if: >-
      ${{ !github.event.repository.private
      && (github.event_name != 'schedule' || vars.WATCH_HOME_ASSISTANT == 'on') }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    if: >-
      ${{ !github.event.repository.private
      && (github.event_name != 'schedule' || vars.WATCH_HOME_ASSISTANT == 'on') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
