# Every suite on everything new: each push and pull request of ours, against Home Assistant's stable, beta and dev
# builds on x64 and arm64 and on HA OS (bench.yml); and each new Home Assistant version, for its channel only
# (home-assistant.yml starts this with the channel and its versions). The Stable check, stable's results with
# hassfest, gates what ships, releases included (tools/passed.py); beta and dev are smoke tests: a failure fails the
# run, never a release.
# Pull requests from forks run it too: no job needs a secret, and its token only reads. In a private repository,
# where GitHub bills each run, every job skips.
name: Tests
run-name: ${{ inputs.versions }}

on:
  push:
    branches: ["**"]  # Not tags: a tag names a commit a push tested.
  pull_request:  # Its merge with the base, a commit of its own.
  workflow_dispatch:
    inputs:
      channel:
        description: Home Assistant's channel
        type: choice
        options: [stable, beta, dev]
      versions:
        description: Its versions (the run's name)
        type: string

permissions:
  contents: read

jobs:
  stable:
    if: >-
      ${{ !github.event.repository.private
      && (github.event_name != 'workflow_dispatch' || inputs.channel == 'stable') }}
    uses: ./.github/workflows/bench.yml
    with:
      channel: stable

  beta:
    if: >-
      ${{ !github.event.repository.private
      && (github.event_name != 'workflow_dispatch' || inputs.channel == 'beta') }}
    uses: ./.github/workflows/bench.yml
    with:
      channel: beta

  dev:
    if: >-
      ${{ !github.event.repository.private
      && (github.event_name != 'workflow_dispatch' || inputs.channel == 'dev') }}
    uses: ./.github/workflows/bench.yml
    with:
      channel: dev

  hassfest:  # Home Assistant's own checks of an integration, for the gate (HACS's catalog asks for validate.yml's).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Its newest on purpose, as Home Assistant documents it: its new checks are new code of Home Assistant's.
      - uses: home-assistant/actions/hassfest@master

  gate:  # Its check is named Stable (tools/passed.py). GitHub reads job IDs without regard to case: not "stable".
    name: Stable
    needs: [stable, hassfest]
    if: >-  # Not once cancelled: a cancelled run is no verdict.
      ${{ !cancelled() && !github.event.repository.private
      && (github.event_name != 'workflow_dispatch' || inputs.channel == 'stable') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Every stable job and hassfest passed
        env:
          RESULTS: ${{ needs.stable.result }} ${{ needs.hassfest.result }}
        run: test "$RESULTS" = "success success"
